<!-- One-Time Seller National ID Verification Modal (Pure KYC Step) -->
<div id="sellerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
    <div class="bg-[#16203a] border border-slate-700/80 w-full max-w-xl rounded-3xl p-6 shadow-2xl relative space-y-5 max-h-[95vh] overflow-y-auto text-slate-100">
        <button onclick="closeVerificationModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="border-b border-slate-800 pb-3">
            <span class="text-xs text-amber-400 font-bold uppercase tracking-wider">Anti-Scam Protection</span>
            <h2 class="text-xl font-black text-white mt-1">One-Time Seller National ID Verification</h2>
            <p class="text-[11px] text-slate-400 mt-0.5">Required only for your first listing. Existing users with registered phone numbers bypass this step automatically.</p>
        </div>

        <form onsubmit="handleKYCSubmit(event)" class="space-y-4 text-xs">
            <!-- Personal Identity Fields -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="font-bold text-slate-300">Father's Full Name (የአባት ስም)</label>
                    <input type="text" id="fatherName" placeholder="Enter father's name" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required />
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-slate-300">Mother's Full Name (የእናት ስም)</label>
                    <input type="text" id="motherName" placeholder="Enter mother's name" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required />
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-slate-300">Phone Number (የስልክ ቁጥር)</label>
                    <input type="tel" id="sellerPhone" placeholder="09... / 07..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required />
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-slate-300">Fayida National ID Number (16 Digits)</label>
                    <input type="text" id="fayidaNum" maxlength="16" pattern="\d{16}" placeholder="16-digit Fayida number" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required />
                </div>
            </div>

            <!-- National ID Photo Verification -->
            <div class="bg-slate-900/80 border border-amber-500/30 rounded-2xl p-4 space-y-3">
                <div class="flex items-center gap-2 text-amber-400 font-bold">
                    <i class="fa-solid fa-id-card"></i>
                    <span>National ID / Fayida Photo Verification</span>
                </div>
                <p class="text-[10px] text-slate-400">Upload clear images of your official ID to prevent fraud and protect buyers.</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="font-bold text-slate-300 text-[11px]">ID Front Side *</label>
                        <input type="file" required class="w-full text-slate-400 text-[10px] file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer" />
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-slate-300 text-[11px]">ID Back Side *</label>
                        <input type="file" required class="w-full text-slate-400 text-[10px] file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer" />
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow-lg transition cursor-pointer text-xs">
                Verify Identity & Continue 🛡️
            </button>
        </form>
    </div>
</div>

<script>
    let registeredPhones = ['0911223344']; // Simulated database for existing users

    function openVerificationModal() {
        document.getElementById('sellerModal').classList.remove('hidden');
        document.getElementById('sellerModal').classList.add('flex');
    }

    function closeVerificationModal() {
        document.getElementById('sellerModal').classList.add('hidden');
        document.getElementById('sellerModal').classList.remove('flex');
    }

    function handleKYCSubmit(e) {
        e.preventDefault();
        const phone = document.getElementById('sellerPhone').value;
        const fayida = document.getElementById('fayidaNum').value;

        // Check if phone number already exists (Existing User check)
        if (registeredPhones.includes(phone)) {
            alert('Welcome back! Your phone number is already verified as an existing seller. Proceeding to post ad.');
        } else {
            registeredPhones.push(phone);
            alert(`Identity successfully verified for Fayida ID: ${fayida}! You are now registered.`);
        }

        closeVerificationModal();
    }
</script>
