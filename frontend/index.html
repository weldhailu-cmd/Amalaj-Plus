<!-- One-Time Seller National ID Verification Modal -->
<div id="sellerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
    <div class="bg-[#16203a] border border-slate-700/80 w-full max-w-3xl rounded-3xl p-6 shadow-2xl relative space-y-5 max-h-[95vh] overflow-y-auto text-slate-100">
        <button onclick="closeVerificationModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg cursor-pointer">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="border-b border-slate-800 pb-3">
            <span class="text-xs text-amber-400 font-bold uppercase tracking-wider">Anti-Scam Protection</span>
            <h2 class="text-xl font-black text-white mt-1">One-Time Seller National ID Verification</h2>
            <p class="text-[11px] text-slate-400 mt-0.5">Required for your first listing to ensure absolute marketplace trust.</p>
        </div>

        <form onsubmit="handleVerificationSubmit(event)" class="space-y-4 text-xs">
            <!-- Platform Selection -->
            <div class="space-y-1.5">
                <label class="font-bold text-slate-300">Select Platform</label>
                <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
                    <button type="button" onclick="selectPlatform(this, 'Telegram')" class="plat-btn py-2 rounded-xl font-bold border bg-amber-500 text-slate-950 border-amber-400 transition cursor-pointer">Telegram</button>
                    <button type="button" onclick="selectPlatform(this, 'YouTube')" class="plat-btn py-2 rounded-xl font-bold border bg-slate-900 text-slate-300 border-slate-800 hover:border-amber-500 transition cursor-pointer">YouTube</button>
                    <button type="button" onclick="selectPlatform(this, 'TikTok')" class="plat-btn py-2 rounded-xl font-bold border bg-slate-900 text-slate-300 border-slate-800 hover:border-amber-500 transition cursor-pointer">TikTok</button>
                    <button type="button" onclick="selectPlatform(this, 'Instagram')" class="plat-btn py-2 rounded-xl font-bold border bg-slate-900 text-slate-300 border-slate-800 hover:border-amber-500 transition cursor-pointer">Instagram</button>
                    <button type="button" onclick="selectPlatform(this, 'Facebook')" class="plat-btn py-2 rounded-xl font-bold border bg-slate-900 text-slate-300 border-slate-800 hover:border-amber-500 transition cursor-pointer">Facebook</button>
                </div>
            </div>

            <!-- Channel Details -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="font-bold text-slate-300">Channel / Account Name</label>
                    <input type="text" placeholder="e.g. Sportsphere" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required />
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-slate-300">Asking Price (ETB)</label>
                    <input type="text" placeholder="e.g. 15000 ETB" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required />
                </div>
            </div>

            <!-- Seller Personal Details (Father & Mother Name as requested) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="font-bold text-slate-300">Father's Full Name (የአባት ስም)</label>
                    <input type="text" placeholder="Enter father's name" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required />
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-slate-300">Mother's Full Name (የእናት ስም)</label>
                    <input type="text" placeholder="Enter mother's name" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white focus:border-amber-500 outline-none" required />
                </div>
            </div>

            <!-- National ID Upload Section -->
            <div class="bg-slate-900/80 border border-amber-500/30 rounded-2xl p-4 space-y-3">
                <div class="flex items-center gap-2 text-amber-400 font-bold">
                    <i class="fa-solid fa-id-card"></i>
                    <span>National ID / Fayida Verification (First-Time Only)</span>
                </div>
                <p class="text-[10px] text-slate-400">Upload clear images of your official ID to prevent fraud and protect buyers.</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="font-bold text-slate-300 text-[11px]">ID Front Side *</label>
                        <input type="file" required class="w-full text-slate-400 text-[10px] file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer" />
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-slate-300 text-[11px]">ID Back Side *</label>
                        <input type="file" required class="w-full text-slate-400 text-[10px] file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer" />
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow-lg transition cursor-pointer text-xs">
                Submit Listing & Verify ID 🛡️
            </button>
        </form>
    </div>
</div>

<script>
    function openVerificationModal() {
        document.getElementById('sellerModal').classList.remove('hidden');
        document.getElementById('sellerModal').classList.add('flex');
    }

    function closeVerificationModal() {
        document.getElementById('sellerModal').classList.add('hidden');
        document.getElementById('sellerModal').classList.remove('flex');
    }

    function handleVerificationSubmit(e) {
        e.preventDefault();
        alert('National ID & First-Time Listing submitted securely. Verification in progress!');
        closeVerificationModal();
    }

    function selectPlatform(btn, name) {
        document.querySelectorAll('.plat-btn').forEach(b => {
            b.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400');
            b.classList.add('bg-slate-900', 'text-slate-300', 'border-slate-800');
        });
        btn.classList.remove('bg-slate-900', 'text-slate-300', 'border-slate-800');
        btn.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400');
    }

    function filterPlatform(platform) {
        document.getElementById('activeCategoryTitle').innerText = platform === 'ALL' ? 'All Platforms Active' : platform + ' Listings Active';
    }
</script>
